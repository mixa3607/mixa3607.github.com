"*":
  command: |
    #!/usr/bin/env bash
    set -eo pipefail
    mkdir -p ./bench-results/rocm-$ROCM_VER
    echo $ROCM_VER > ./bench-results/rocm-$ROCM_VER/rocm-ver
    {env} ./llama-bench {args} | tee ./bench-results/rocm-$ROCM_VER/{profile}.jsonl
  env:
    HIP_VISIBLE_DEVICES: "1,0,3,2"
    HSA_FORCE_FINE_GRAIN_PCIE: "1"
    HSA_XNACK: "0"
    GGML_ENABLE_CUSTOM_AR: "1"
    GGML_CUDA_REPACK_Q8_0: "1"
    LLAMA_ENABLE_MTP_OPT: "1"
    GGML_TP_AR_TWOSHOT: "1"
    LLAMA_PLE_SHARD: "0"
    GPU_MAX_HW_QUEUES: "8"
  args:
    lazy-mode: "off"
    offline: true
    output: jsonl
    verbose: false
    progress: true
